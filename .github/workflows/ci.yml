name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LS_CI_MODE: "1"          # small-but-representative dataset -> seconds, not minutes
      LS_SEED: "20260721"
      PYTHONPATH: "src:."      # package import + repo-root imports (P2 fix)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Generate CI-scale dataset
        run: python -m lonestar.generation --out data/raw

      - name: Leakage audit (writes docs/leakage_audit_report.md)
        run: python -m lonestar.audit --data data/raw

      - name: EDA findings (no figures needed in CI)
        run: python -m lonestar.eda --data data/raw --no-figures

      - name: Build point-in-time features
        run: python -m lonestar.features --data data/raw --out data/features

      - name: "Train models (CI: skip MLflow tracking)"
        run: python -m lonestar.modeling --features data/features/features.parquet --out models --no-mlflow

      - name: Build decision policy + economics memo
        run: python -m lonestar.decisions --features data/features/features.parquet --raw data/raw --model models/fraud_model.joblib --out models

      - name: Batch-score the feature table
        run: python -m lonestar.batch --features data/features/features.parquet --model models/fraud_model.joblib --policy models/decision_policy.json --out data/scored/scored.parquet

      - name: "Drift monitoring (CI: skip HTML)"
        run: python -m lonestar.monitoring --features data/features/features.parquet --raw data/raw --model models/fraud_model.joblib --out reports --no-html

      - name: Tests
        run: pytest -q
