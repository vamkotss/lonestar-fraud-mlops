name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LS_CI_MODE: "1"          # small-but-representative dataset -> seconds, not minutes
      LS_SEED: "20260721"
      PYTHONPATH: "src:."      # package import + repo-root imports (P2 fix)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Generate CI-scale dataset
        run: python -m lonestar.generation --out data/raw

      - name: Tests
        run: pytest -q
